<script>
(function(){
"use strict";
var app=document.getElementById('app');
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.physicallyCorrectLights=true;
app.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x101216);
scene.fog=new THREE.Fog(0x101216,70,180);

var camera=new THREE.PerspectiveCamera(50,1,0.05,500);

var controls=(function(el){
  var tgt=new THREE.Vector3(0,2,0);
  var sph=new THREE.Spherical(30,1.1,0);
  var MINP=0.05, MAXP=Math.PI*0.95;
  function apply(){
    sph.phi=Math.max(MINP,Math.min(MAXP,sph.phi));
    sph.radius=Math.max(1.2,Math.min(140,sph.radius));
    var o=new THREE.Vector3().setFromSpherical(sph);
    camera.position.copy(tgt).add(o);
    camera.lookAt(tgt);
  }
  function setFromCamera(){
    var off=camera.position.clone().sub(tgt);
    sph.setFromVector3(off);
    apply();
  }
  var ptrs={},lastPinch=0,lastMid=null;
  function pan(dx,dy){
    var h=el.clientHeight||1;
    var scale=2*sph.radius*Math.tan(camera.fov*Math.PI/360)/h;
    var right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    var up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    tgt.addScaledVector(right,-dx*scale).addScaledVector(up,dy*scale);
    apply();
  }
  function rot(dx,dy){
    var h=el.clientHeight||1;
    sph.theta-=2*Math.PI*dx/h;
    sph.phi-=2*Math.PI*dy/h;
    apply();
  }
  el.addEventListener('pointerdown',function(e){
    el.setPointerCapture&&el.setPointerCapture(e.pointerId);
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY,b:e.button};
    e.preventDefault();
  });
  el.addEventListener('pointermove',function(e){
    var p=ptrs[e.pointerId];if(!p)return;
    var ids=Object.keys(ptrs);
    var dx=e.clientX-p.x,dy=e.clientY-p.y;
    p.x=e.clientX;p.y=e.clientY;
    if(ids.length===2){
      var a=ptrs[ids[0]],b=ptrs[ids[1]];
      var dist=Math.hypot(a.x-b.x,a.y-b.y);
      var mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(lastPinch>0){sph.radius*=lastPinch/dist;}
      if(lastMid){pan(mid.x-lastMid.x,mid.y-lastMid.y);}
      lastPinch=dist;lastMid=mid;apply();
    }else if(p.b===2||e.shiftKey){pan(dx,dy);}
    else{rot(dx,dy);}
  });
  function up(e){delete ptrs[e.pointerId];lastPinch=0;lastMid=null;}
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
  el.addEventListener('wheel',function(e){
    e.preventDefault();
    sph.radius*=(e.deltaY>0?1.1:0.9);apply();
  },{passive:false});
  apply();
  function forward(d){
    var dir=tgt.clone().sub(camera.position);dir.y=0;
    if(dir.lengthSq()<1e-6)return;
    dir.normalize();
    tgt.addScaledVector(dir,d);apply();
  }
  function turn(a){
    var v=tgt.clone().sub(camera.position);
    v.applyAxisAngle(new THREE.Vector3(0,1,0),a);
    tgt.copy(camera.position).add(v);
    var off=camera.position.clone().sub(tgt);
    sph.setFromVector3(off);apply();
  }
  function lift(d){
    tgt.y=Math.max(0.2,Math.min(60,tgt.y+d));apply();
  }
  function strafe(d){
    var right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    right.y=0;if(right.lengthSq()<1e-6)return;
    right.normalize();
    tgt.addScaledVector(right,d);apply();
  }
  function tilt(a){
    var v=tgt.clone().sub(camera.position);
    var right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    v.applyAxisAngle(right,a);
    tgt.copy(camera.position).add(v);
    var off=camera.position.clone().sub(tgt);
    sph.setFromVector3(off);apply();
  }
  return {
    get target(){return tgt;},
    update:function(){setFromCamera();},
    forward:forward, turn:turn, lift:lift, tilt:tilt, strafe:strafe
  };
})(renderer.domElement);

(function(){
  var acts={
    fwd:  function(dt){controls.forward( 9*dt);},
    back: function(dt){controls.forward(-9*dt);},
    strafeL:function(dt){controls.strafe(-6*dt);},
    strafeR:function(dt){controls.strafe( 6*dt);},
    left: function(dt){controls.turn( 1.4*dt);},
    right:function(dt){controls.turn(-1.4*dt);},
    up:   function(dt){controls.lift( 4.5*dt);},
    down: function(dt){controls.lift(-4.5*dt);},
    tiltup:  function(dt){controls.tilt( 0.9*dt);},
    tiltdown:function(dt){controls.tilt(-0.9*dt);}
  };
  var held={},raf=null,prev=0;
  function tick(ts){
    var dt=Math.min(0.05,(ts-prev)/1000||0.016);prev=ts;
    var any=false;
    for(var k in held){if(held[k]&&acts[k]){acts[k](dt);any=true;}}
    raf=any?requestAnimationFrame(tick):null;
  }
  function start(k){
    held[k]=true;
    if(!raf){prev=performance.now();raf=requestAnimationFrame(tick);}
  }
  function stop(k){delete held[k];}
  Array.prototype.forEach.call(document.querySelectorAll('.pbtn'),function(b){
    var a=b.dataset.a;
    b.addEventListener('pointerdown',function(e){e.preventDefault();b.setPointerCapture&&b.setPointerCapture(e.pointerId);start(a);});
    b.addEventListener('pointerup',function(){stop(a);});
    b.addEventListener('pointercancel',function(){stop(a);});
    b.addEventListener('lostpointercapture',function(){stop(a);});
  });
  var keymap={KeyW:'fwd',KeyS:'back',KeyA:'strafeL',KeyD:'strafeR',KeyQ:'down',KeyE:'up',KeyR:'tiltup',KeyF:'tiltdown',
              ArrowUp:'fwd',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right'};
  window.addEventListener('keydown',function(e){
    var a=keymap[e.code];if(a){e.preventDefault();start(a);}
  });
  window.addEventListener('keyup',function(e){
    var a=keymap[e.code];if(a)stop(a);
  });
})();

box(1.4,4.6,1.4,-10.2,2.3,-2.2, mat(0x22262e));
box(1.4,4.6,1.4, 10.2,2.3,-2.2, mat(0x22262e));
var tm=mat(0x9aa3b2,0.5,0.6);
box(0.35,7.6,0.35,-9.4,3.8,-1.2,tm);

[-1,1].forEach(function(s){
  box(2.0,0.8,12, s*5.5,0.4,6, mat(0x343945));

function figure(x,z,onStage,c){

function countTris(root){var n=0;root.traverse(function(o){
  if(o.isMesh&&o.geometry){var g=o.geometry;
    n+=g.index?g.index.count/3:(g.attributes.position?g.attributes.position.count/3:0);}});
  return Math.round(n);}

function frameObject(root,dir){
  var b=new THREE.Box3().setFromObject(root);
  if(b.isEmpty())return;
  var c=b.getCenter(new THREE.Vector3()), s=b.getSize(new THREE.Vector3());
  var r=Math.max(s.x,s.y,s.z);
  var d=dir||new THREE.Vector3(0,0.45,1);
  camera.position.copy(c).addScaledVector(d.clone().normalize(),r*1.35);
  controls.target.copy(c);controls.update();
}

(function(){
  function fetchPart(p, tries){
    return fetch(p,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status+' '+p);
      return r.arrayBuffer();
    }).catch(function(e){
      if(tries>0)return fetchPart(p,tries-1);
      throw e;
    });
  }
  fetch('model.meta.json?v='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('meta HTTP '+r.status);return r.json();
  }).then(function(meta){
    var got=0,total=meta.parts.length;
    setMeta('モデル取得中… 0/'+total);
    return Promise.all(meta.parts.map(function(p,idx){
      return fetchPart(p,2).then(function(buf){
        got++;setMeta('モデル取得中… '+got+'/'+total);
        return {idx:idx,buf:buf};
      });
    })).then(function(chunks){
      chunks.sort(function(a,b){return a.idx-b.idx;});
      var len=0;chunks.forEach(function(c){len+=c.buf.byteLength;});
      if(meta.bytes&&len!==meta.bytes)
        throw new Error('サイズ不一致 '+len+'/'+meta.bytes);
      var all=new Uint8Array(len),off=0;
      chunks.forEach(function(c){all.set(new Uint8Array(c.buf),off);off+=c.buf.byteLength;});
      var dv=new DataView(all.buffer);
      if(dv.getUint32(0,true)!==0x46546C67)
        throw new Error('GLBマジック不正 '+dv.getUint32(0,true).toString(16));
      if(!THREE.GLTFLoader)throw new Error('GLTFLoader未ロード(CDN遮断?)');
      setMeta('モデル解析中… '+(len/1e6).toFixed(1)+'MB');
      new THREE.GLTFLoader().parse(all.buffer,'',function(g){
        g.scene.userData.keepTransform=true;
        addLoaded(g.scene, meta.name||'model');
        fetch('scene_extra.json').then(function(r){return r.json();})
          .then(function(x){applyBlenderScene(g.scene,x);})
          .catch(function(e){setMeta('照明適用失敗: '+(e&&e.message||e));});
      },function(e){
        setMeta('解析失敗: '+((e&&(e.message||e.toString()))||'不明').slice(0,120));
      });
    });
  }).catch(function(e){
    setMeta('読込失敗: '+((e&&(e.message||e.toString()))||'不明').slice(0,120));
  });
})();

function addLoaded(obj,name){
  if(loaded)scene.remove(loaded);
  demo.visible=false;
  obj.traverse(function(o){if(o.isMesh){o.castShadow=o.receiveShadow=true;
    if(o.material&&'wireframe' in o.material)o.material.wireframe=wireOn;}});
  if(!obj.userData.keepTransform){
    var b=new THREE.Box3().setFromObject(obj);
    var s=b.getSize(new THREE.Vector3());
    var maxDim=Math.max(s.x,s.y,s.z)||1;
    if(maxDim>200||maxDim<0.5){obj.scale.multiplyScalar(20/maxDim);}
    b.setFromObject(obj);
    obj.position.y-=b.min.y;
    var c=b.getCenter(new THREE.Vector3());
    obj.position.x-=c.x;obj.position.z-=c.z;
  }
  loaded=obj;current=obj;scene.add(obj);
  setMeta(name+' · '+countTris(obj).toLocaleString()+' tris');
  frameObject(obj);
}
function loadFile(file){
  var name=file.name, ext=name.split('.').pop().toLowerCase();
  var reader=new FileReader();
  setMeta('読み込み中… '+name);
  reader.onerror=function(){setMeta('読み込み失敗: '+name);};
  reader.onload=function(){
    try{
      if((ext==='glb'||ext==='gltf')&&!THREE.GLTFLoader){setMeta('glTF読込機能が利用できない環境です');}else if(ext==='glb'||ext==='gltf'){
        new THREE.GLTFLoader().parse(reader.result,'',function(g){addLoaded(g.scene,name);},
          function(){setMeta('glTF解析失敗: '+name);});
      }else if(ext==='obj'&&!THREE.OBJLoader){setMeta('OBJ読込機能が利用できない環境です');}else if(ext==='obj'){
        var text=new TextDecoder().decode(reader.result);
        addLoaded(new THREE.OBJLoader().parse(text),name);
      }else if(ext==='stl'&&!THREE.STLLoader){setMeta('STL読込機能が利用できない環境です');}else if(ext==='stl'){
        var geo=new THREE.STLLoader().parse(reader.result);
        geo.computeVertexNormals();
        addLoaded(new THREE.Mesh(geo,mat(0xb9c2d0,0.6,0.15)),name);
      }else{
        setMeta('未対応形式: .'+ext+'（glb/gltf/obj/stl対応）');
      }
    }catch(e){setMeta('解析エラー: '+name);}
  };
  reader.readAsArrayBuffer(file);
}
document.getElementById('file').addEventListener('change',function(){
  if(this.files&&this.files[0])loadFile(this.files[0]);
  this.value='';
});
var drop=document.getElementById('drop'),dragDepth=0;
window.addEventListener('dragenter',function(e){e.preventDefault();dragDepth++;drop.classList.add('show');});
window.addEventListener('dragover',function(e){e.preventDefault();});
window.addEventListener('dragleave',function(e){e.preventDefault();if(--dragDepth<=0){dragDepth=0;drop.classList.remove('show');}});
window.addEventListener('drop',function(e){
  e.preventDefault();dragDepth=0;drop.classList.remove('show');
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);
});

var blenderCams=null;
function applyBlenderScene(root,x){
  if(THREE.RectAreaLightUniformsLib){try{THREE.RectAreaLightUniformsLib.init();}catch(e){}}
  scene.children.slice().forEach(function(o){
    if(o.isHemisphereLight||o.isDirectionalLight)scene.remove(o);
  });
  scene.add(new THREE.AmbientLight(0x262a33,0.22));
  var wc=(x.world&&x.world.color)||[0.01,0.01,0.012];
  scene.background=new THREE.Color(wc[0],wc[1],wc[2]);
  scene.fog=null;
  function cv(v){return new THREE.Vector3(v[0],v[2],-v[1]);}
  var K=(x.lm_per_watt||60.0);
  (x.lights||[]).forEach(function(L){
    if(!L.energy)return;
    var col=new THREE.Color(L.color[0],L.color[1],L.color[2]);
    var pos=cv(L.loc), dir=cv(L.dir);
    if(L.type==='AREA'){
      var ang=Math.min(1.35, 0.55+0.12*Math.max(L.size||1,L.size_y||1));
      var s=new THREE.SpotLight(col,1,0,ang,0.9,2);
      s.power=L.energy*K;
      s.position.copy(pos);
      s.target.position.copy(pos.clone().add(dir.clone().multiplyScalar(10)));
      scene.add(s);scene.add(s.target);
    }else if(L.type==='SPOT'){
      var sp=new THREE.SpotLight(col,1,0,(L.spot_size||1.2)/2,Math.max(0.2,L.blend||0.3),2);
      sp.power=L.energy*K;
      sp.position.copy(pos);
      sp.target.position.copy(pos.clone().add(dir.clone().multiplyScalar(10)));
      scene.add(sp);scene.add(sp.target);
    }else if(L.type==='POINT'){
      var p=new THREE.PointLight(col,1,0,2);
      p.power=L.energy*K;
      p.position.copy(pos);scene.add(p);
    }else if(L.type==='SUN'){
      var d=new THREE.DirectionalLight(col,L.energy);
      d.position.copy(pos);scene.add(d);
    }
  });
  var mats=x.materials||{};
  root.traverse(function(o){
    if(!o.isMesh||!o.material)return;
    var arr=Array.isArray(o.material)?o.material:[o.material];
    arr.forEach(function(m){
      var info=mats[m.name];
      if(info&&m.emissive){
        m.emissive.setRGB(info.emission_color[0],info.emission_color[1],info.emission_color[2]);
        m.emissiveIntensity=Math.min(30,Math.max(1,info.emission_strength));
        if(m.emissiveMap)m.emissiveIntensity=Math.min(12,m.emissiveIntensity);
        m.toneMapped=true;
      }
    });
  });
  blenderCams=x.cameras||null;
  var order=['01_北半球の天井','02_正面からの天井','06_中央投映機','03_星空の空間','04_鳥瞰配置'];
  var btns=document.querySelectorAll('.viewbtn');
  var labels=['天井','正面','投映機','星空','鳥瞰'];
  Array.prototype.forEach.call(btns,function(b,i){
    var cn=order[i];
    if(!cn||!blenderCams[cn])return;
    b.textContent=labels[i];
    b.onclick=function(){
      var c=blenderCams[cn];
      var p=cv(c.loc),f=cv(c.fwd);
      camera.position.copy(p);
      controls.target.copy(p.clone().add(f.multiplyScalar(12)));
      var hf=2*Math.atan((c.sensor/2)/c.lens);
      camera.fov=2*Math.atan(Math.tan(hf/2)/camera.aspect)*180/Math.PI;
      camera.updateProjectionMatrix();
      controls.update();
    };
  });
  var ac=x.active_camera;
  if(ac&&blenderCams[ac]){
    var c=blenderCams[ac],p=cv(c.loc),f=cv(c.fwd);
    camera.position.copy(p);
    controls.target.copy(p.clone().add(f.multiplyScalar(12)));
    var hf0=2*Math.atan((c.sensor/2)/c.lens);
    camera.fov=2*Math.atan(Math.tan(hf0/2)/camera.aspect)*180/Math.PI;
    camera.updateProjectionMatrix();
    controls.update();
  }
  setMeta((document.getElementById('meta').textContent||'')+' · Blender照明適用');
}

function resize(){
  var w=app.clientWidth,h=app.clientHeight;
  renderer.setSize(w,h,true);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
var clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  var t=clock.getElapsedTime();
  demo.traverse(function(o){
    if(o.material&&o.material.emissive&&o.material.emissiveIntensity)
      o.material.emissiveIntensity=0.75+0.25*Math.sin(t*1.3);
  });
  renderer.render(scene,camera);
})();
window.DBG={scene:scene,camera:camera,controls:controls,renderer:renderer,
  getLoaded:function(){return loaded;}};
})();
</script>
